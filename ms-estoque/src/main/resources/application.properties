spring.application.name=ms-estoque
server.port=8081

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:estoque
spring.datasource.username=sa
spring.datasource.password=

# H2 Driver
spring.datasource.driver-class-name=org.h2.Driver

# JPA and Hibernate specific configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Carregar o data.sql depois que o Hibernate criar as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 Console (opcional, para acessar o console web)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console