spring.application.name=ms-vendas
server.port=8083

# URL dos outros serviços para GET
servicos.clientes.url=http://localhost:8084/api/clientes
servicos.produtos.url=http://localhost:8082/api/produtos
servicos.estoque.url=http://localhost:8081/api/estoque

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:vendas
spring.datasource.username=sa
spring.datasource.password=

# H2 Driver
spring.datasource.driver-class-name=org.h2.Driver

# JPA and Hibernate specific configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (opcional, para acessar o console web)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console